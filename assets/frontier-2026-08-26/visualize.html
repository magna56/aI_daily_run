<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'" />
<title>The two-gate patch check</title>
<style>
  :root {
    --bg: #111217; --ink: #e7e2d8; --muted: #9a9488; --dim: #857f70;
    --line: rgba(255,255,255,.11); --card: rgba(255,255,255,.03);
    --accent: #a78bfa; --accent2: #c4b5fd;
    --yes: #6ec18e; --no: #d9744e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 28px; }
  h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }

  .toggle { display: flex; gap: 6px; margin: 0 0 18px; }
  .toggle button {
    flex: 1; font-family: var(--mono); font-size: 12px; padding: 10px; cursor: pointer;
    background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 7px; text-align: left;
  }
  .toggle button .k { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
  .toggle button.on { background: rgba(167,139,250,.14); color: var(--accent2); border-color: var(--accent); }
  .toggle button.on .k { color: var(--accent2); }
  .toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .rounds { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; }
  .rounds button { font-family: var(--mono); font-size: 12px; padding: 7px 14px; cursor: pointer; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; }
  .rounds button:hover { border-color: var(--accent); }
  .rounds .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .rounds .reset { margin-left: auto; border-color: var(--accent); color: var(--accent2); }

  .log { display: grid; gap: 7px; margin: 0 0 16px; }
  .step { border: 1px solid var(--line); border-left: 3px solid var(--dim); border-radius: 8px; padding: 9px 12px; background: var(--card); font-size: 13px; }
  .step.accepted { border-left-color: var(--yes); }
  .step.rejected { border-left-color: var(--no); }
  .step b { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .step.accepted b { color: var(--yes); } .step.rejected b { color: var(--no); }
  .gates { display: flex; gap: 10px; margin-top: 4px; font-family: var(--mono); font-size: 11px; }
  .gate { padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); }
  .gate.pass { color: var(--yes); border-color: rgba(110,193,142,.4); }
  .gate.fail { color: var(--no); border-color: rgba(217,116,78,.4); }

  .out { border: 1px solid var(--line); border-radius: 8px; padding: 13px; background: rgba(0,0,0,.22); }
  .out .row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; margin: 4px 0; }
  .out .row .v { font-weight: 700; }
  .note { margin: 14px 0 0; font-size: 12.5px; color: var(--dim); border-left: 2px solid var(--line); padding-left: 11px; }
</style>
</head>
<body>
<div class="wrap" data-visualizer="frontier-2026-08-26">
  <h1>The two-gate patch check</h1>
  <p class="sub">Same starting harness, same acceptance rule. Pick a patch style, run a few rounds, and watch what gate 2 (the dev-set check) does to a patch that only fixed what it saw.</p>

  <div class="toggle">
    <button type="button" id="modeShallow"><span class="k">Patch style A</span>Shallow — memorizes the 5 failing task IDs</button>
    <button type="button" id="modeDeep"><span class="k">Patch style B</span>Deep diagnosis — learns the missing skill</button>
  </div>

  <div class="rounds">
    <button type="button" id="step">Run round →</button>
    <span class="n" id="roundNum">round 0 of 4</span>
    <button type="button" id="reset" class="reset">Reset</button>
  </div>

  <div class="log" id="log"></div>

  <div class="out" id="out"></div>
  <p class="note" id="note"></p>
</div>

<script>
(function () {
  // Mirrors code_example.py exactly: 8-task mini-batch, 20-task dev-set,
  // 12-task held-out test. The shallow patch fixes the batch and generalizes
  // to nothing; the deep patch fixes the batch and the dev-set both.
  var SCENARIOS = {
    shallow: {
      label: "Shallow (memorized IDs)",
      change: "memorize 5 task IDs",
      batchOk: true, devOk: false,
      devScore: 0.20, heldOut: 0.00
    },
    deep: {
      label: "Deep diagnosis (learned skill)",
      change: "add capability [search, verify, write]",
      batchOk: true, devOk: true,
      devScore: 1.00, heldOut: 1.00
    }
  };

  var mode = "shallow";
  var round = 0;
  var MAX_ROUNDS = 4;
  var accepted = false;   // once a patch is accepted, later rounds have nothing left to fix
  var log = [];

  var els = ["modeShallow", "modeDeep", "step", "roundNum", "reset", "log", "out", "note"]
    .reduce(function (a, id) { a[id] = document.getElementById(id); return a; }, {});

  function render() {
    els.modeShallow.className = mode === "shallow" ? "on" : "";
    els.modeDeep.className = mode === "deep" ? "on" : "";
    els.roundNum.textContent = "round " + round + " of " + MAX_ROUNDS;
    els.step.disabled = round >= MAX_ROUNDS;

    els.log.innerHTML = log.map(function (e) {
      return '<div class="step ' + (e.accepted ? "accepted" : "rejected") + '">' +
        "<b>" + (e.accepted ? "accepted" : "rejected") + "</b> — proposed: " + e.change +
        '<div class="gates">' +
          '<span class="gate ' + (e.batchOk ? "pass" : "fail") + '">batch_ok=' + e.batchOk + "</span>" +
          '<span class="gate ' + (e.devOk ? "pass" : "fail") + '">dev_ok=' + e.devOk + "</span>" +
        "</div></div>";
    }).join("") || '<p class="note" style="margin:0">Run a round to see the gate decide.</p>';

    var s = SCENARIOS[mode];
    var heldOut = accepted ? s.heldOut : null;
    els.out.innerHTML =
      '<div class="row"><span>dev-set score</span><span class="v" style="color:' +
        (accepted && s.devOk ? "var(--yes)" : "var(--muted)") + '">' +
        Math.round((accepted ? s.devScore : 0.20) * 100) + "%</span></div>" +
      '<div class="row"><span>held-out test (never seen by either loop)</span><span class="v">' +
        (heldOut === null ? "—" : Math.round(heldOut * 100) + "%") + "</span></div>";

    els.note.textContent = mode === "shallow"
      ? "This patch will pass gate 1 every round and fail gate 2 every round — memorizing 5 IDs never helps a dev-set task that isn't one of those 5."
      : "This patch clears both gates on round 0 — it fixed the real missing skill, so every task needing that skill improves, batch and dev-set alike.";
  }

  els.step.addEventListener("click", function () {
    if (round >= MAX_ROUNDS) return;
    var s = SCENARIOS[mode];
    if (!accepted) {
      log.push({ change: s.change, batchOk: s.batchOk, devOk: s.devOk, accepted: s.batchOk && s.devOk });
      if (s.batchOk && s.devOk) accepted = true;
    } else {
      log.push({ change: "(nothing left to fix)", batchOk: true, devOk: true, accepted: true });
    }
    round++;
    render();
  });

  els.modeShallow.addEventListener("click", function () { mode = "shallow"; reset(); });
  els.modeDeep.addEventListener("click", function () { mode = "deep"; reset(); });
  els.reset.addEventListener("click", reset);

  function reset() {
    round = 0; accepted = false; log = [];
    render();
  }

  function postHeight() {
    try {
      parent.postMessage({
        type: "adl-visualize-height",
        height: document.documentElement.scrollHeight
      }, "*");
    } catch (e) {}
  }
  window.addEventListener("load", postHeight);
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.documentElement);
  render();
})();
</script>
</body>
</html>

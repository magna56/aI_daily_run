<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>When a prompt cache stops paying</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0d18; color: #dfe4f2;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 18px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #8f9ab8; font-size: 12.5px; margin: 0 0 16px; }
  .panel { background: #10131f; border: 1px solid #222839; border-radius: 10px; padding: 14px; }
  .row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); }
  label { display: block; font-size: 12px; color: #9aa5c4; margin-bottom: 5px; }
  label b { color: #dfe4f2; font-weight: 650; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #7c8cf8; }
  .seg { display: flex; gap: 6px; margin-top: 13px; align-items: center; }
  button { font: inherit; font-size: 12.5px; padding: 6px 11px; border-radius: 7px; cursor: pointer;
           background: #171b2b; color: #cdd5ee; border: 1px solid #2b3247; }
  button:focus-visible { outline: 2px solid #7c8cf8; outline-offset: 2px; }
  .reset { margin-left: auto; }
  .bars { margin-top: 17px; display: grid; gap: 9px; }
  .b { display: grid; grid-template-columns: 190px 1fr 104px; align-items: center; gap: 10px; }
  .b span { font-size: 12px; color: #9aa5c4; }
  .track { height: 23px; background: #171b2b; border-radius: 5px; overflow: hidden; position: relative; }
  .track i { display: block; height: 100%; border-radius: 5px; transition: width .18s; }
  .track u { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.45); }
  .b em { font-style: normal; text-align: right; font: 600 13px ui-monospace, Menlo, monospace;
          font-variant-numeric: tabular-nums; }
  .out { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); margin-top: 17px; }
  .stat { background: #10131f; border: 1px solid #222839; border-radius: 9px; padding: 11px 12px; }
  .stat u { display: block; font-size: 11px; color: #8f9ab8; text-decoration: none; margin-bottom: 4px; }
  .stat b { font: 600 20px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .good { color: #5fd4a4; } .bad { color: #f08a4b; } .mid { color: #dfe4f2; }
  .say { margin-top: 15px; font-size: 12.5px; color: #a7b1cd; border-left: 2px solid #2b3247;
         padding-left: 11px; }
  .say b { color: #dfe4f2; }
</style>
</head>
<body>
<main data-visualizer="2026-09-13">
  <h1>When a prompt cache stops paying</h1>
  <p class="sub">A write costs 1.25x and a read costs 0.1x, so the hit rate decides whether this
     is a saving or a surcharge. The white line marks parity with never caching.</p>

  <div class="panel">
    <div class="row">
      <div>
        <label for="gap">Mean gap between calls <b id="gapv">4</b> min</label>
        <input type="range" id="gap" min="1" max="120" step="1" value="4">
      </div>
      <div>
        <label for="inval">Prefix broken every <b id="invalv">90</b> calls</label>
        <input type="range" id="inval" min="1" max="120" step="1" value="90">
      </div>
      <div>
        <label for="tokens">Prefix size <b id="tokensv">5,629</b> tokens</label>
        <input type="range" id="tokens" min="200" max="12000" step="100" value="5629">
      </div>
    </div>
    <div class="seg"><button class="reset" id="reset">Reset</button></div>
  </div>

  <div class="bars" id="bars"></div>

  <div class="out">
    <div class="stat"><u>writes</u><b id="w" class="mid">—</b></div>
    <div class="stat"><u>reads</u><b id="r" class="mid">—</b></div>
    <div class="stat"><u>cost per call</u><b id="c" class="mid">—</b></div>
    <div class="stat"><u>versus no cache</u><b id="d" class="mid">—</b></div>
  </div>

  <p class="say" id="say"></p>
</main>
<script>
(function () {
  "use strict";
  var CALLS = 400, TTL = 30, WRITE = 1.25, READ = 0.10, MIN_PREFIX = 1024;
  var DEFAULTS = { gap: 4, inval: 90, tokens: 5629 };
  var st = Object.assign({}, DEFAULTS);
  var $ = function (id) { return document.getElementById(id); };
  function rngFrom(s){ return function(){ s=(s*1103515245+12345)>>>0; return s/4294967296; }; }
  function expo(rnd, mean){ return -Math.log(1 - rnd()) * mean; }

  function simulate() {
    // Below the minimum nothing is cacheable, so every call pays full price.
    if (st.tokens < MIN_PREFIX) return { cost: CALLS, writes: 0, reads: 0, cacheable: false };
    var rnd = rngFrom(5), cost = 0, writes = 0, reads = 0, warm = false, since = 0;
    for (var i = 0; i < CALLS; i++) {
      since += expo(rnd, st.gap);
      var broken = st.inval && i % st.inval === 0 && i > 0;
      if (!warm || since > TTL || broken) {
        cost += WRITE; writes++; warm = true; since = 0;
      } else {
        cost += READ; reads++; since = 0;      // a read refreshes the TTL
      }
    }
    return { cost: cost, writes: writes, reads: reads, cacheable: true };
  }

  function bar(host, label, perCall, max, cls) {
    var row = document.createElement("div"); row.className = "b";
    var l = document.createElement("span"); l.textContent = label;
    var tr = document.createElement("div"); tr.className = "track";
    var f = document.createElement("i");
    f.style.width = Math.max(1, perCall / max * 100).toFixed(1) + "%";
    f.style.background = cls === "good" ? "rgba(95,212,164,.55)" : "rgba(240,138,75,.55)";
    var mark = document.createElement("u");           // parity with no cache
    mark.style.left = (1 / max * 100).toFixed(1) + "%";
    tr.appendChild(f); tr.appendChild(mark);
    var v = document.createElement("em");
    v.textContent = perCall.toFixed(2) + "x"; v.className = cls;
    row.appendChild(l); row.appendChild(tr); row.appendChild(v);
    host.appendChild(row);
  }

  function render() {
    $("gapv").textContent = st.gap;
    $("invalv").textContent = st.inval;
    $("tokensv").textContent = st.tokens.toLocaleString();

    var s = simulate(), per = s.cost / CALLS;
    var host = $("bars"); host.textContent = "";
    var max = Math.max(1.35, per * 1.15);
    bar(host, "never caching", 1.0, max, "bad");
    bar(host, "with the cache", per, max, per < 1 ? "good" : "bad");

    $("w").textContent = s.writes;
    $("r").textContent = s.reads;
    $("r").className = s.reads > s.writes ? "good" : "bad";
    $("c").textContent = per.toFixed(2) + "x";
    $("c").className = per < 1 ? "good" : "bad";
    var delta = (per - 1) * 100;
    $("d").textContent = (delta > 0 ? "+" : "") + delta.toFixed(0) + "%";
    $("d").className = delta < -5 ? "good" : delta > 0 ? "bad" : "mid";

    var say;
    if (!s.cacheable) {
      say = "<b>Below the 1,024-token minimum.</b> Nothing is cached at all, so every call pays "
          + "full price and none of the rest of this applies. Short prompts are outside this "
          + "entirely — look at model choice or output length instead.";
    } else if (per > 1) {
      say = "<b>The cache is costing you money.</b> More writes than reads means you are paying "
          + "1.25x to store prefixes nobody comes back for. This is the case the write premium "
          + "creates, and it does not look like a bug from the outside.";
    } else if (st.inval < 6) {
      say = "<b>The prefix breaks almost every call.</b> Still cheaper than nothing, but the "
          + "writes column is where the money goes — and eight of the nine miss reasons are "
          + "configuration, not prompt text.";
    } else if (st.gap > TTL) {
      say = "<b>Gaps wider than the " + TTL + "-minute window.</b> The saving erodes but does not "
          + "reverse: traffic is bursty, so plenty of calls still land inside the window on a "
          + "warm prefix. Latency flattens the return; uniqueness is what would flip it.";
    } else {
      say = "<b>" + s.reads + " reads against " + s.writes + " writes.</b> This is what caching "
          + "is supposed to look like. The ratio, not the hit rate on its own, is the number "
          + "that tells you whether the write premium is being earned back.";
    }
    $("say").innerHTML = say;
    reportHeight();
  }

  function reportHeight() {
    parent.postMessage({ type: "adl-visualize-height",
                         height: document.documentElement.scrollHeight }, "*");
  }

  ["gap", "inval", "tokens"].forEach(function (k) {
    $(k).addEventListener("input", function (e) { st[k] = +e.target.value; render(); });
  });
  $("reset").addEventListener("click", function () {
    st = Object.assign({}, DEFAULTS);
    $("gap").value = st.gap; $("inval").value = st.inval; $("tokens").value = st.tokens;
    render();
  });

  render();
  addEventListener("load", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
})();
</script>
</body>
</html>

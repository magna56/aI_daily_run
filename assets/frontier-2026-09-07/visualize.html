<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>KV cache eviction: the pin is the policy</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0d18; color: #dfe4f2;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 18px; }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .01em; }
  .sub { color: #8f9ab8; font-size: 12.5px; margin: 0 0 16px; }
  .panel { background: #10131f; border: 1px solid #222839; border-radius: 10px; padding: 14px; }
  .ctrls { display: grid; gap: 13px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  label { display: block; font-size: 12px; color: #9aa5c4; margin-bottom: 5px; }
  label b { color: #dfe4f2; font-weight: 650; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #7c8cf8; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  button { font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 7px; cursor: pointer;
           background: #171b2b; color: #cdd5ee; border: 1px solid #2b3247; }
  button[aria-pressed=true] { background: #2a3566; border-color: #4b5ba8; color: #fff; }
  button:focus-visible { outline: 2px solid #7c8cf8; outline-offset: 2px; }
  .reset { margin-left: auto; }
  .heads { margin: 16px 0 6px; display: grid; gap: 3px; }
  .head { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 8px; }
  .head span { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #7d88a6; }
  .strip { display: flex; height: 13px; border-radius: 3px; overflow: hidden; background: #171b2b; }
  .strip i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: #8f9ab8; margin: 10px 0 2px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
              margin-right: 5px; vertical-align: -1px; }
  .out { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-top: 16px; }
  .stat { background: #10131f; border: 1px solid #222839; border-radius: 9px; padding: 11px 12px; }
  .stat u { display: block; font-size: 11px; color: #8f9ab8; text-decoration: none; margin-bottom: 4px; }
  .stat b { font: 600 20px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .good { color: #5fd4a4; } .bad { color: #f08a4b; } .mid { color: #dfe4f2; }
  .say { margin-top: 14px; font-size: 12.5px; color: #a7b1cd; border-left: 2px solid #2b3247; padding-left: 11px; }
  .say b { color: #dfe4f2; }
</style>
</head>
<body>
<main data-visualizer="frontier-2026-09-07">
  <h1>The pin is the policy</h1>
  <p class="sub">Eight attention heads, each evicting its own cache down to the budget. Watch which
     facts survive — and what happens to the prompt when nothing pins it.</p>

  <div class="panel">
    <div class="ctrls">
      <div>
        <label for="budget">Budget per head <b id="budgetv">1024</b> of 4000 positions</label>
        <input type="range" id="budget" min="256" max="3000" step="64" value="1024">
      </div>
      <div>
        <label for="restate">Times the trace restates a value <b id="restatev">4</b></label>
        <input type="range" id="restate" min="1" max="8" step="1" value="4">
      </div>
    </div>
    <div class="toggles">
      <button id="pin" aria-pressed="true">Pin the prompt</button>
      <button id="policy" aria-pressed="false">Policy: random draw</button>
      <button class="reset" id="reset">Reset</button>
    </div>
  </div>

  <div class="heads" id="heads"></div>
  <div class="legend">
    <span><i style="background:#7c8cf8"></i>prompt kept</span>
    <span><i style="background:#5fd4a4"></i>trace kept</span>
    <span><i style="background:#1b2030"></i>evicted</span>
  </div>

  <div class="out">
    <div class="stat"><u>prompt facts recovered</u><b id="sp" class="mid">—</b></div>
    <div class="stat"><u>trace facts recovered</u><b id="st" class="mid">—</b></div>
    <div class="stat"><u>all 10 facts intact</u><b id="sj" class="mid">—</b></div>
    <div class="stat"><u>compression</u><b id="sc" class="mid">—</b></div>
  </div>

  <p class="say" id="say"></p>
</main>
<script>
(function () {
  "use strict";
  var TOTAL = 4000, PROMPT = 400, HEADS = 8, RECENCY = 64, CELLS = 96, TRIALS = 120;
  // Planted-fact retrieval by number of heads still holding it (Wang et al., 2026).
  var RECOVERY = [0, .03, .60, .83, .93, .96, .98, .99, .99];
  var DEFAULTS = { budget: 1024, restate: 4, pin: true, scored: false };
  var st = Object.assign({}, DEFAULTS);

  var $ = function (id) { return document.getElementById(id); };
  function seeded(s) { return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // One head's keep-set, as a sorted array of ranges we can sample cheaply.
  function keptSet(rnd) {
    var keep = new Uint8Array(TOTAL), i;
    if (st.pin) for (i = 0; i < PROMPT; i++) keep[i] = 1;
    for (i = Math.max(0, TOTAL - RECENCY); i < TOTAL; i++) keep[i] = 1;
    var lo = st.pin ? PROMPT : 0, pool = [];
    for (i = lo; i < TOTAL - RECENCY; i++) if (!keep[i]) pool.push(i);
    var room = st.budget - (st.pin ? PROMPT : 0) - RECENCY;
    if (room > 0) {
      if (st.scored) {
        // A recency-tilted score plus this head's own attention pattern.
        var scored = pool.map(function (p) { return [p, (p / TOTAL) * 0.3 + rnd()]; });
        scored.sort(function (a, b) { return b[1] - a[1]; });
        for (i = 0; i < room && i < scored.length; i++) keep[scored[i][0]] = 1;
      } else {
        for (i = pool.length - 1; i > 0; i--) {
          var j = (rnd() * (i + 1)) | 0, t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        }
        for (i = 0; i < room && i < pool.length; i++) keep[pool[i]] = 1;
      }
    }
    return keep;
  }

  /* The stats are closed-form, not simulated. Materialising 8 keep-sets x 120
     trials froze the pane on every slider drag, and it was never necessary:
     survival of one position is Bernoulli, so recovery is just a binomial over
     heads. This lands within half a point of code_example.py's Monte Carlo. */
  function keepProb(pos, room, poolLen, lo) {
    if (pos < lo) return 1;                       // pinned, or inside the prompt
    if (pos >= TOTAL - RECENCY) return 1;         // recency window
    if (room <= 0) return 0;
    if (!st.scored) return Math.min(1, room / poolLen);
    // Scored: keep the top `room` of (tilt * position + uniform noise). Solve for
    // the score threshold that admits exactly that many, then read off p(pos).
    var target = Math.min(1, room / poolLen), lo_t = -1, hi_t = 1 + 0.3, t, i, mean;
    for (i = 0; i < 24; i++) {
      t = (lo_t + hi_t) / 2;
      mean = 0;
      for (var k = 0; k < 40; k++) {
        var at = lo + (TOTAL - RECENCY - lo) * (k + 0.5) / 40;
        mean += Math.min(1, Math.max(0, 1 - (t - 0.3 * at / TOTAL)));
      }
      mean /= 40;
      if (mean > target) lo_t = t; else hi_t = t;
    }
    t = (lo_t + hi_t) / 2;
    return Math.min(1, Math.max(0, 1 - (t - 0.3 * pos / TOTAL)));
  }

  function choose(n, k) {
    var r = 1;
    for (var i = 0; i < k; i++) r = r * (n - i) / (i + 1);
    return r;
  }

  // Expected retrieval for a fact held, independently, by each head with prob q.
  function recovery(q) {
    var acc = 0;
    for (var k = 0; k <= HEADS; k++) {
      acc += choose(HEADS, k) * Math.pow(q, k) * Math.pow(1 - q, HEADS - k) * RECOVERY[k];
    }
    return acc;
  }

  function measure() {
    var lo = st.pin ? PROMPT : 0;
    var poolLen = TOTAL - RECENCY - lo;
    var room = st.budget - (st.pin ? PROMPT : 0) - RECENCY;

    /* Average over WHERE the fact sits, not just the midpoint. Under a scored
       policy the keep probability depends on position, so an early trace fact
       dies in every head at once and a late one survives in every head. That
       spread is exactly why a ranking trails an independent draw, and reading a
       single midpoint hides it -- the first version of this said the scorer won. */
    var SAMPLES = 24, i, k;
    var rp = 0, rt = 0;
    for (k = 0; k < SAMPLES; k++) {
      var pp = PROMPT * (k + 0.5) / SAMPLES;
      rp += recovery(keepProb(pp, room, poolLen, lo));

      var first = PROMPT + (TOTAL - PROMPT - 800) * (k + 0.5) / SAMPLES;
      var missAll = 1;
      for (i = 0; i < st.restate; i++) {
        missAll *= 1 - keepProb(first + i * 90, room, poolLen, lo);
      }
      rt += recovery(1 - missAll);
    }
    rp /= SAMPLES; rt /= SAMPLES;
    return { p: rp, t: rt, j: Math.pow(rp, 2) * Math.pow(rt, 8) };
  }

  function drawHeads() {
    var wrap = $("heads"); wrap.textContent = "";
    var rnd = seeded(7);
    for (var h = 0; h < HEADS; h++) {
      var keep = keptSet(rnd);
      var row = document.createElement("div"); row.className = "head";
      var lab = document.createElement("span"); lab.textContent = "head " + h;
      var strip = document.createElement("div"); strip.className = "strip";
      for (var c = 0; c < CELLS; c++) {
        var from = Math.floor(c * TOTAL / CELLS), to = Math.floor((c + 1) * TOTAL / CELLS);
        var kept = 0;
        for (var i = from; i < to; i++) if (keep[i]) kept++;
        var frac = kept / (to - from);
        var cell = document.createElement("i");
        cell.style.flex = "1";
        cell.style.background = frac < 0.08 ? "#1b2030"
          : (from < PROMPT ? "rgba(124,140,248," : "rgba(95,212,164,") + (0.25 + frac * 0.75) + ")";
        strip.appendChild(cell);
      }
      row.appendChild(lab); row.appendChild(strip); wrap.appendChild(row);
    }
  }

  function pct(x) { return (x * 100).toFixed(1) + "%"; }

  function render() {
    $("budgetv").textContent = st.budget;
    $("restatev").textContent = st.restate;
    $("pin").setAttribute("aria-pressed", String(st.pin));
    $("pin").textContent = st.pin ? "Pin the prompt" : "Prompt not pinned";
    $("policy").setAttribute("aria-pressed", String(st.scored));
    $("policy").textContent = "Policy: " + (st.scored ? "learned score" : "random draw");

    drawHeads();
    var m = measure();
    $("sp").textContent = pct(m.p);
    $("sp").className = m.p > 0.9 ? "good" : m.p < 0.6 ? "bad" : "mid";
    $("st").textContent = pct(m.t);
    $("st").className = m.t > 0.8 ? "good" : m.t < 0.5 ? "bad" : "mid";
    $("sj").textContent = pct(m.j);
    $("sj").className = m.j > 0.2 ? "good" : m.j < 0.05 ? "bad" : "mid";
    $("sc").textContent = (TOTAL / st.budget).toFixed(1) + "x";

    var say;
    if (!st.pin) {
      say = "<b>Nothing pins the prompt.</b> The prompt is written once, so every head that drops "
          + "it drops it for good — and the trace barely notices, because it was restated "
          + st.restate + " times. This is the accident every published scorer was living on.";
    } else if (st.scored) {
      say = "<b>Pinned, and scoring.</b> The prompt is safe, so the score has nothing left to "
          + "protect. It still trails the coin flip, because a ranking every head agrees with "
          + "makes the heads drop the same tokens.";
    } else {
      say = "<b>Pinned, and drawing at random.</b> No signal is read at all. Each head draws "
          + "independently, so a fact kept in even three heads is recovered 83% of the time.";
    }
    if (st.restate === 1) {
      say += " With one mention per value, the trace has no redundancy left and random eviction "
           + "has nothing to lean on.";
    }
    $("say").innerHTML = say;
    reportHeight();
  }

  function reportHeight() {
    parent.postMessage({ type: "adl-visualize-height",
                         height: document.documentElement.scrollHeight }, "*");
  }

  $("budget").addEventListener("input", function (e) { st.budget = +e.target.value; render(); });
  $("restate").addEventListener("input", function (e) { st.restate = +e.target.value; render(); });
  $("pin").addEventListener("click", function () { st.pin = !st.pin; render(); });
  $("policy").addEventListener("click", function () { st.scored = !st.scored; render(); });
  $("reset").addEventListener("click", function () {
    st = Object.assign({}, DEFAULTS);
    $("budget").value = st.budget; $("restate").value = st.restate;
    render();
  });

  render();
  addEventListener("load", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
})();
</script>
</body>
</html>

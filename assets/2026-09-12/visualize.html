<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>Finding the gap against filling it</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0d18; color: #dfe4f2;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 18px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #8f9ab8; font-size: 12.5px; margin: 0 0 16px; }
  .panel { background: #10131f; border: 1px solid #222839; border-radius: 10px; padding: 14px; }
  .row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  label { display: block; font-size: 12px; color: #9aa5c4; margin-bottom: 5px; }
  label b { color: #dfe4f2; font-weight: 650; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #7c8cf8; }
  .seg { display: flex; gap: 6px; margin-top: 13px; align-items: center; }
  button { font: inherit; font-size: 12.5px; padding: 6px 11px; border-radius: 7px; cursor: pointer;
           background: #171b2b; color: #cdd5ee; border: 1px solid #2b3247; }
  button:focus-visible { outline: 2px solid #7c8cf8; outline-offset: 2px; }
  .reset { margin-left: auto; }
  .bars { margin-top: 17px; display: grid; gap: 9px; }
  .b { display: grid; grid-template-columns: 250px 1fr 76px; align-items: center; gap: 10px; }
  .b span { font-size: 12px; color: #9aa5c4; }
  .track { height: 23px; background: #171b2b; border-radius: 5px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 5px; transition: width .18s; }
  .b em { font-style: normal; text-align: right; font: 600 13px ui-monospace, Menlo, monospace;
          font-variant-numeric: tabular-nums; }
  .out { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 17px; }
  .stat { background: #10131f; border: 1px solid #222839; border-radius: 9px; padding: 11px 12px; }
  .stat u { display: block; font-size: 11px; color: #8f9ab8; text-decoration: none; margin-bottom: 4px; }
  .stat b { font: 600 20px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .good { color: #5fd4a4; } .bad { color: #f08a4b; } .mid { color: #dfe4f2; }
  .say { margin-top: 15px; font-size: 12.5px; color: #a7b1cd; border-left: 2px solid #2b3247;
         padding-left: 11px; }
  .say b { color: #dfe4f2; }
</style>
</head>
<body>
<main data-visualizer="2026-09-12">
  <h1>Finding the gap against filling it</h1>
  <p class="sub">Both routes end at the same model doing the same job. The only thing that differs
     is how many gaps ever reach it — drag the sliders and watch which one moves the outcome.</p>

  <div class="panel">
    <div class="row">
      <div>
        <label for="notice">Model notices a gap unprompted <b id="noticev">10</b>%</label>
        <input type="range" id="notice" min="0" max="100" step="1" value="10">
      </div>
      <div>
        <label for="detect">Structural check catches a gap <b id="detectv">89</b>%</label>
        <input type="range" id="detect" min="0" max="100" step="1" value="89">
      </div>
      <div>
        <label for="fix">Model fixes a gap it was shown <b id="fixv">81</b>%</label>
        <input type="range" id="fix" min="0" max="100" step="1" value="81">
      </div>
    </div>
    <div class="seg"><button class="reset" id="reset">Reset</button></div>
  </div>

  <div class="bars" id="bars"></div>

  <div class="out">
    <div class="stat"><u>gaps reaching the model</u><b id="reach" class="mid">—</b></div>
    <div class="stat"><u>gaps left open</u><b id="open" class="mid">—</b></div>
    <div class="stat"><u>lift from the check</u><b id="lift" class="good">—</b></div>
  </div>

  <p class="say" id="say"></p>
</main>
<script>
(function () {
  "use strict";
  var GAPS_PER_TASK = 1.0;               // average injected gaps
  var DEFAULTS = { notice: 10, detect: 89, fix: 81 };
  var st = Object.assign({}, DEFAULTS);
  var $ = function (id) { return document.getElementById(id); };

  // A gap closes only if it is FOUND and then FIXED. The model does the second
  // step equally well either way; the routes differ only in the first.
  function closed(findRate) { return (findRate / 100) * (st.fix / 100); }

  function bar(host, label, frac, text, cls) {
    var row = document.createElement("div"); row.className = "b";
    var l = document.createElement("span"); l.textContent = label;
    var tr = document.createElement("div"); tr.className = "track";
    var f = document.createElement("i");
    f.style.width = Math.max(0.8, frac * 100).toFixed(1) + "%";
    f.style.background = cls === "good" ? "rgba(95,212,164,.55)" : "rgba(240,138,75,.55)";
    tr.appendChild(f);
    var v = document.createElement("em"); v.textContent = text; v.className = cls;
    row.appendChild(l); row.appendChild(tr); row.appendChild(v);
    host.appendChild(row);
  }

  function render() {
    $("noticev").textContent = st.notice;
    $("detectv").textContent = st.detect;
    $("fixv").textContent = st.fix;

    var intro = closed(st.notice), struct = closed(st.detect);
    var host = $("bars"); host.textContent = "";
    bar(host, "ask the model what is missing", intro, (intro*100).toFixed(1) + "%",
        intro > 0.5 ? "good" : "bad");
    bar(host, "structural check, then ask the model", struct, (struct*100).toFixed(1) + "%",
        struct > 0.5 ? "good" : "bad");

    $("reach").textContent = st.detect + "%";
    $("reach").className = st.detect > 60 ? "good" : "bad";
    var left = (1 - struct) * GAPS_PER_TASK;
    $("open").textContent = left.toFixed(2);
    $("open").className = left < 0.3 ? "good" : left > 0.6 ? "bad" : "mid";
    var lift = struct - intro;
    $("lift").textContent = (lift >= 0 ? "+" : "") + (lift * 100).toFixed(1) + " pts";
    $("lift").className = lift > 0.1 ? "good" : lift < -0.01 ? "bad" : "mid";

    var say;
    if (st.detect <= st.notice) {
      say = "<b>The check is no better than introspection.</b> At that point it is pure cost — "
          + "which is the honest bar a structural detector has to clear before it is worth "
          + "building at all.";
    } else if (st.fix < 25) {
      say = "<b>The model cannot fix what it is shown.</b> Then finding gaps buys you very "
          + "little, and the bottleneck has moved somewhere this design does not help. The "
          + "paper's result depends on the fix rate being high.";
    } else if (st.notice > 60) {
      say = "<b>A model that notices unprompted.</b> If yours really does, you do not need the "
          + "detector — but check it on real tasks before believing it, because the measured "
          + "figure across 13 models was under ten percent.";
    } else {
      say = "<b>Same model, same fix rate, " + (lift * 100).toFixed(0) + " points apart.</b> "
          + "Everything that changed is how many gaps were ever put in front of it. That is "
          + "why the step worth building is the one that finds them.";
    }
    $("say").innerHTML = say;
    reportHeight();
  }

  function reportHeight() {
    parent.postMessage({ type: "adl-visualize-height",
                         height: document.documentElement.scrollHeight }, "*");
  }

  ["notice", "detect", "fix"].forEach(function (k) {
    $(k).addEventListener("input", function (e) { st[k] = +e.target.value; render(); });
  });
  $("reset").addEventListener("click", function () {
    st = Object.assign({}, DEFAULTS);
    $("notice").value = st.notice; $("detect").value = st.detect; $("fix").value = st.fix;
    render();
  });

  render();
  addEventListener("load", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
})();
</script>
</body>
</html>

<head>
<meta charset="utf-8" />
<title>The AI Commit — LeadDev table card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #111217;
    --panel: #161821;
    --ink: #e7e2d8;
    --muted: #9a9488;
    --dim: #857f70;
    --sky: #38bdf8;
    --sky2: #7dd3fc;
    --line: rgba(255,255,255,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0b0f;
    color: var(--ink);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  }
  /* 4in × 3in at 300dpi export target = 1200×900 CSS px at 1x; we render at 2x via chrome */
  .sheet {
    width: 1200px;
    height: 900px;
    margin: 24px auto;
    background:
      radial-gradient(ellipse 80% 60% at 12% 0%, rgba(56,189,248,.14), transparent 55%),
      radial-gradient(ellipse 70% 50% at 100% 100%, rgba(196,181,253,.08), transparent 50%),
      linear-gradient(160deg, #14161d 0%, #111217 55%, #0e1016 100%);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 56px 64px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 48px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .sheet::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 18px;
    pointer-events: none;
  }
  .left { display: flex; flex-direction: column; gap: 28px; position: relative; z-index: 1; }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .brand img {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    flex-shrink: 0;
  }
  .brand-name {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: .04em;
    background: linear-gradient(90deg, var(--sky2), #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.1;
  }
  .brand-sub {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    color: var(--dim);
    letter-spacing: .18em;
    margin-top: 6px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 42px;
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -.02em;
    max-width: 14ch;
    color: var(--ink);
  }
  .pitch {
    font-size: 22px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 28ch;
    font-weight: 500;
  }
  .url {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--sky2);
    letter-spacing: .02em;
  }
  .right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    position: relative;
    z-index: 1;
  }
  .qr-wrap {
    background: #e7e2d8;
    padding: 22px;
    border-radius: 20px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08);
  }
  .qr-wrap img {
    width: 280px;
    height: 280px;
    display: block;
  }
  .scan {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    color: var(--dim);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  @media print {
    html, body { background: white; }
    .sheet { margin: 0; border-radius: 0; border: none; page-break-inside: avoid; }
  }
</style>
</head>

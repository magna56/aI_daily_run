<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Redirecting…</title>
<script>
  // GitHub Pages serves this project site at /aI_daily_run/. Any other path
  // hits this 404 page — bounce back to the canonical app URL so shared links
  // still work. location.hash is carried across automatically, since a
  // fragment never reaches the server, which is what keeps #<session>
  // permalinks working through the redirect.
  (function () {
    var BASE = "/aI_daily_run/";
    if (location.pathname !== BASE) {
      location.replace(BASE + location.search + location.hash);
    }
  })();
</script>
</head>

  Redirecting to <a style="color:#a78bfa" href="/aI_daily_run/">The AI Commit</a>…
</body>
</html>
